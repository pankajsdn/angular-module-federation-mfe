user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        server_name localhost;

        root /usr/share/nginx/html;
        index index.html index.htm;

        location / {
            # Add CORS headers if this MFE needs to be fetched by a shell on a different port
            # For now, assuming it might be run standalone or shell handles its own CORS if needed for assets
            # add_header 'Access-Control-Allow-Origin' '*' always;
            # add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            # add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Range' always;

            # if ($request_method = 'OPTIONS') {
            #     add_header 'Access-Control-Allow-Origin' '*' always;
            #     add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            #     add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Range' always;
            #     add_header 'Content-Length' 0;
            #     add_header 'Content-Type' 'text/plain charset=UTF-8';
            #     return 204;
            # }
            try_files $uri $uri/ /index.html;
        }

        # If remoteEntry.js needs specific CORS headers when this app acts as a remote
        location = /remoteEntry.js {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Range' always;
            try_files $uri $uri/ /index.html; # Should serve the actual remoteEntry.js
        }
    }
}
