user nginx;
worker_processes auto; # Or a specific number like 1 or 4
pid /run/nginx.pid;

# Include files in /etc/nginx/modules-enabled/*.conf; (Debian/Ubuntu specific, Alpine doesn't use this by default)
# We can skip this for a minimal Alpine setup unless specific modules are needed.

events {
    worker_connections 768; # Default is 768, adjust if needed
    # multi_accept on; # Optional
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # server_tokens off; # Optional: Hide Nginx version

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # SSL Settings (optional, if you were to add SSL later)
    # ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, TLSv1, TLSv1.1 is often recommended
    # ssl_prefer_server_ciphers on;

    # Logging Settings
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip Settings (optional)
    # gzip on;
    # gzip_disable "msie6";
    # gzip_vary on;
    # gzip_proxied any;
    # gzip_comp_level 6;
    # gzip_buffers 16 8k;
    # gzip_http_version 1.1;
    # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Our server block for the Angular application
    server {
        listen 80 default_server; # Added default_server to make it explicit
        listen [::]:80 default_server; # For IPv6

        server_name localhost; # Or your domain

        root /usr/share/nginx/html;
        index index.html index.htm;

        location / {
            # Add CORS headers to allow requests from any origin
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Range' always;

            # Handle preflight OPTIONS requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Range' always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                return 204;
            }

            try_files $uri $uri/ /index.html;
        }

        # It's good practice to also ensure remoteEntry.js specifically gets these headers,
        # though the location / block should cover it.
        location = /remoteEntry.js {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Range' always;
            try_files $uri $uri/ /index.html; # Should serve the actual remoteEntry.js
        }

        # You can add other specific location blocks here if needed
        # For example, to deny access to hidden files:
        # location ~ /\. {
        #    deny all;
        # }
    }

    # If you had other server blocks for other sites, they would go here.
    # Example:
    # server {
    #   listen 80;
    #   server_name another.domain.com;
    #   root /var/www/another_site;
    #   index index.html;
    # }

    # It's generally recommended NOT to include /etc/nginx/conf.d/*.conf
    # if you are defining all server blocks within this main nginx.conf
    # to avoid conflicts, unless you specifically intend to load them.
    # For this case, we are trying to ensure ONLY our server block is active.
    # include /etc/nginx/conf.d/*.conf;
}
